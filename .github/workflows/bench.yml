name: Runner Benchmark

# 独立于任何项目的纯算力基准。只手动触发，不参与任何构建流程。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: '运行环境'
        type: choice
        options: [ubuntu-latest, macos-latest, windows-latest]
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  bench:
    name: bench on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: CPU benchmark (single / parallel / alloc)
        shell: bash
        run: |
          echo "=== JDK ==="
          java -version 2>&1 | head -2
          echo "=== 机器 ==="
          uname -a || true
          echo "cores_reported=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo '?')"
          java Bench.java

      - name: Disk benchmark
        shell: bash
        continue-on-error: true
        run: |
          # bs 用大写 M：GNU dd 只认 M，BSD dd 大小写都认（第一版用小写 m，Ubuntu 上直接报 invalid number）
          dd if=/dev/zero of=./benchfile bs=1M count=1024 2>&1 | tail -1
          dd if=./benchfile of=/dev/null bs=1M 2>&1 | tail -1
          rm -f ./benchfile
