name: Runner Benchmark

# 独立于任何项目的纯算力基准。只手动触发，不参与任何构建流程。
on:
  workflow_dispatch:
    inputs:
      runner:
        description: '运行环境'
        type: choice
        options: [ubuntu-latest, macos-latest, windows-latest]
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  bench:
    name: bench on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: CPU / memory benchmark
        shell: bash
        run: |
          set -e
          echo "=== 环境 ==="
          java -version 2>&1 | head -2
          uname -a || true
          START=$(date +%s)
          java Bench.java
          END=$(date +%s)
          echo "bench_wall_s=$((END-START))"

      - name: Disk benchmark
        shell: bash
        run: |
          set -e
          START=$(date +%s)
          dd if=/dev/zero of=./benchfile bs=1m count=1024 2>&1 | tail -1
          MID=$(date +%s)
          dd if=./benchfile of=/dev/null bs=1m 2>&1 | tail -1
          END=$(date +%s)
          echo "write_s=$((MID-START)) read_s=$((END-MID))"
          rm -f ./benchfile
